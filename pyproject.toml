[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetflow-tool"
version = "0.1.0"
description = "离线优先的 Excel/CSV 自动化工具"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "SheetFlow Contributors"}]
dependencies = [
  "pandas>=2.1,<3",
  "openpyxl>=3.1,<4",
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7,<7"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2", "pandas-stubs>=2.1"]
build = ["PyInstaller>=6.10,<7"]

[project.scripts]
sheetflow = "sheetflow.cli:app"
sheetflow-gui = "sheetflow.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sheetflow --cov-report=term-missing"

[tool.coverage.run]
omit = [
  "src/sheetflow/gui.py",
  "src/sheetflow/cli.py",
  "src/sheetflow/__main__.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
packages = ["sheetflow"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
